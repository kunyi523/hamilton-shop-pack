name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main / root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json 2> /tmp/pages.err; then
            echo "Pages already enabled."
          else
            echo "Pages not enabled yet; creating site."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f 'source[branch]=main' -f 'source[path]=/'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages"
